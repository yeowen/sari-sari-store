<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sari-Sari Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand text-success" href="index.html">🛒 Sari-Sari Store</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto align-items-lg-center" id="navLinks"></ul>
        </div>
    </div>
</nav>

<div id="welcomeBanner"></div>

<section class="hero text-center py-5">
    <div class="container">
        <h1 class="display-4 fw-bold">Welcome to Our Sari-Sari Store!</h1>
        <p class="lead">Order your everyday needs online and pick them up at our store.</p>
        <a href="products.html" class="btn btn-success btn-lg">Shop Now</a>
    </div>
</section>

<section class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="🔍 Search products...">
        </div>
    </div>
</section>

<section class="container mt-4">
    <h3>Categories</h3>
    <div class="d-flex gap-2 flex-wrap" id="categoryContainer">
        <button class="btn btn-success category-btn" data-category="all">All</button>
        <button class="btn btn-outline-success category-btn" data-category="beverages">Beverages</button>
        <button class="btn btn-outline-success category-btn" data-category="snacks">Snacks</button>
        <button class="btn btn-outline-success category-btn" data-category="canned">Canned Goods</button>
        <button class="btn btn-outline-success category-btn" data-category="personal">Personal Care</button>
        <button class="btn btn-outline-success category-btn" data-category="household">Household</button>
    </div>
</section>

<section class="container mt-5" id="products">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Available Products</h3>
        <span class="text-muted">Choose your products</span>
    </div>
    <div class="row g-4" id="productList"></div>
</section>

<footer class="bg-dark text-white text-center p-4 mt-5">
    <p class="mb-0">© 2026 Sari-Sari Store Management System</p>
    <small>Cash payment upon pickup</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/shared.js"></script>
<script src="js/script.js"></script>

</body>
</html>
