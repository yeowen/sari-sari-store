<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Sari-Sari Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-text { color: #dc3545; font-size: 14px; margin-top: 4px; display: none; }
        .form-control.is-invalid { border-color: #dc3545; }
        .form-control.is-valid { border-color: #198754; }
    </style>
</head>

<body>

<div class="register-container">
    <div class="card register-card shadow">
        <div class="card-body p-4">

            <div class="text-center mb-4">
                <h2 class="text-success">🛒 Sari-Sari Store</h2>
                <p class="text-muted">Create your account</p>
            </div>

            <form id="registerForm" novalidate>

                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" placeholder="Enter your full name">
                    <div class="error-text" id="nameError">Full name is required.</div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email">
                    <div class="error-text" id="emailError">Please enter a valid email.</div>
                </div>

                <div class="mb-3">
                    <label for="contact" class="form-label">Contact Number</label>
                    <input type="tel" class="form-control" id="contact" placeholder="09XXXXXXXXX">
                    <div class="error-text" id="contactError">Please enter a valid contact number.</div>
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <input type="text" class="form-control" id="address" placeholder="Your address">
                    <div class="error-text" id="addressError">Address is required.</div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password">
                    <div class="error-text" id="passwordError">Password must be at least 6 characters.</div>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password">
                    <div class="error-text" id="confirmError">Passwords do not match.</div>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="terms">
                    <label class="form-check-label" for="terms">
                        I agree to the terms and conditions
                    </label>
                    <div class="error-text" id="termsError">You must agree to the terms.</div>
                </div>

                <button type="submit" class="btn btn-success w-100">Create Account</button>

            </form>

            <div class="text-center mt-3">
                <p class="mb-0">
                    Already have an account?
                    <a href="login.html" class="text-success">Login</a>
                </p>
            </div>

            <div class="text-center mt-3">
                <a href="index.html" class="text-decoration-none">← Back to Home</a>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/shared.js"></script>

<script>
    const registerForm = document.getElementById("registerForm");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const contactInput = document.getElementById("contact");
    const addressInput = document.getElementById("address");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");
    const termsCheck = document.getElementById("terms");

    const nameError = document.getElementById("nameError");
    const emailError = document.getElementById("emailError");
    const contactError = document.getElementById("contactError");
    const addressError = document.getElementById("addressError");
    const passwordError = document.getElementById("passwordError");
    const confirmError = document.getElementById("confirmError");
    const termsError = document.getElementById("termsError");

    function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function showError(input, errorElement, message) {
        if (input) {
            input.classList.add("is-invalid");
            input.classList.remove("is-valid");
        }
        errorElement.textContent = message;
        errorElement.style.display = "block";
    }

    function showSuccess(input, errorElement) {
        if (input) {
            input.classList.remove("is-invalid");
            input.classList.add("is-valid");
        }
        errorElement.style.display = "none";
    }

    // Validation events
    nameInput.addEventListener("input", function() {
        if (nameInput.value.trim().length >= 2) showSuccess(nameInput, nameError);
        else { nameInput.classList.remove("is-valid", "is-invalid"); nameError.style.display = "none"; }
    });

    emailInput.addEventListener("input", function() {
        if (isValidEmail(emailInput.value.trim())) showSuccess(emailInput, emailError);
        else { emailInput.classList.remove("is-valid", "is-invalid"); emailError.style.display = "none"; }
    });

    passwordInput.addEventListener("input", function() {
        if (passwordInput.value.length >= 6) showSuccess(passwordInput, passwordError);
        else { passwordInput.classList.remove("is-valid", "is-invalid"); passwordError.style.display = "none"; }
        if (confirmInput.value.length > 0) {
            if (confirmInput.value === passwordInput.value) showSuccess(confirmInput, confirmError);
            else { confirmInput.classList.remove("is-valid", "is-invalid"); confirmError.style.display = "none"; }
        }
    });

    confirmInput.addEventListener("input", function() {
        if (confirmInput.value === passwordInput.value && confirmInput.value.length > 0) showSuccess(confirmInput, confirmError);
        else { confirmInput.classList.remove("is-valid", "is-invalid"); confirmError.style.display = "none"; }
    });

    registerForm.addEventListener("submit", async function(event) {
        event.preventDefault();
        let isValid = true;

        if (nameInput.value.trim().length < 2) { showError(nameInput, nameError, "Please enter your full name."); isValid = false; }
        else showSuccess(nameInput, nameError);

        const email = emailInput.value.trim().toLowerCase();
        if (email === "" || !isValidEmail(email)) { showError(emailInput, emailError, "Please enter a valid email."); isValid = false; }
        else showSuccess(emailInput, emailError);

        const contact = contactInput.value.trim();
        if (contact === "" || contact.length < 10) { showError(contactInput, contactError, "Please enter a valid contact."); isValid = false; }
        else showSuccess(contactInput, contactError);

        const address = addressInput.value.trim();
        if (address === "") { showError(addressInput, addressError, "Address is required."); isValid = false; }
        else showSuccess(addressInput, addressError);

        const password = passwordInput.value;
        if (password === "" || password.length < 6) { showError(passwordInput, passwordError, "Password must be 6+ chars."); isValid = false; }
        else showSuccess(passwordInput, passwordError);

        if (confirmInput.value === "" || confirmInput.value !== password) { showError(confirmInput, confirmError, "Passwords do not match."); isValid = false; }
        else showSuccess(confirmInput, confirmError);

        if (!termsCheck.checked) { showError(null, termsError, "You must agree."); isValid = false; }
        else termsError.style.display = "none";

        if (!isValid) {
            showToast("Please fix the errors in the form.", "warning");
            return;
        }

        const newUser = {
            name: nameInput.value.trim(),
            email: email,
            password: password,
            contact: contact,
            address: address
        };

        try {
            const response = await fetch('api/register.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newUser)
            });
            const data = await response.json();

            if (data.success) {
                showToast("Registration successful! You can now login.", "success");
                setTimeout(function() { window.location.href = "login.html"; }, 1500);
            } else {
                showToast(data.message, "danger");
            }
        } catch (error) {
            showToast("Server error. Please try again.", "danger");
        }
    });
</script>

</body>
</html>
