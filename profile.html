<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Sari-Sari Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR (DYNAMIC) -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand text-success" href="index.html">🛒 Sari-Sari Store</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto align-items-lg-center" id="navLinks"></ul>
        </div>
    </div>
</nav>

<section class="page-header text-center">
    <div class="container">
        <h1>👤 My Profile</h1>
        <p>View and update your personal information.</p>
    </div>
</section>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <form id="profileForm">

                        <div class="mb-3">
                            <label class="form-label">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="profileName" placeholder="Enter your full name" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="profileEmail" readonly>
                            <small class="text-muted">Email cannot be changed.</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Contact Number</label>
                            <input type="tel" class="form-control" id="profileContact" placeholder="09XXXXXXXXX">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <input type="text" class="form-control" id="profileAddress" placeholder="Your address">
                        </div>

                        <hr>

                        <h6 class="mb-3">🔒 Change Password (Optional)</h6>

                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" class="form-control" id="newPassword" placeholder="Leave blank to keep current">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirm New Password</label>
                            <input type="password" class="form-control" id="confirmNewPassword" placeholder="Confirm new password">
                        </div>

                        <button type="submit" class="btn btn-success w-100">Save Changes</button>

                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center p-4 mt-5">
    <p class="mb-0">© 2026 Sari-Sari Store Management System</p>
    <small>Cash payment upon pickup</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/shared.js"></script>
<script src="js/script.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        if (typeof renderNavbar === "function") renderNavbar();

        const user = JSON.parse(localStorage.getItem("loggedInUser") || "{}");

        if (!user.email) {
            showToast("You must be logged in to view this page.", "warning");
            setTimeout(function() {
                window.location.href = "login.html";
            }, 1500);
            return;
        }

        document.getElementById("profileName").value = user.name || "";
        document.getElementById("profileEmail").value = user.email || "";
        document.getElementById("profileContact").value = user.contact || "";
        document.getElementById("profileAddress").value = user.address || "";

        document.getElementById("profileForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const name = document.getElementById("profileName").value.trim();
            const contact = document.getElementById("profileContact").value.trim();
            const address = document.getElementById("profileAddress").value.trim();
            const newPassword = document.getElementById("newPassword").value;
            const confirmNewPassword = document.getElementById("confirmNewPassword").value;

            if (name.length < 2) {
                showToast("Please enter a valid name (at least 2 characters).", "warning");
                return;
            }

            if (newPassword || confirmNewPassword) {
                if (newPassword.length < 6) {
                    showToast("New password must be at least 6 characters.", "warning");
                    return;
                }
                if (newPassword !== confirmNewPassword) {
                    showToast("Passwords do not match.", "danger");
                    return;
                }
                user.password = newPassword;
            }

            user.name = name;
            user.contact = contact;
            user.address = address;

            localStorage.setItem("loggedInUser", JSON.stringify(user));

            // I-update din ang users array kung registered user (hindi demo)
            const users = JSON.parse(localStorage.getItem("users") || "[]");
            const idx = users.findIndex(u => u.email === user.email);
            if (idx !== -1) {
                users[idx].name = name;
                users[idx].contact = contact;
                users[idx].address = address;
                if (newPassword) users[idx].password = newPassword;
                localStorage.setItem("users", JSON.stringify(users));
            }

            showToast("Profile updated successfully!", "success");

            document.getElementById("newPassword").value = "";
            document.getElementById("confirmNewPassword").value = "";

            if (typeof renderNavbar === "function") renderNavbar();
        });
    });
</script>

</body>
</html>
