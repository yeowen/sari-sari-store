<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Sari-Sari Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR (DYNAMIC) -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand text-success" href="index.html">🛒 Sari-Sari Store</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto align-items-lg-center" id="navLinks"></ul>
        </div>
    </div>
</nav>

<section class="page-header text-center">
    <div class="container">
        <h1>📦 My Orders</h1>
        <p>Track your orders and pickup schedule.</p>
    </div>
</section>

<div class="container">
    <!-- FILTER -->
    <div class="card shadow-sm mb-3">
        <div class="card-body d-flex flex-wrap gap-2 align-items-center">
            <strong>Filter by status:</strong>
            <button class="btn btn-sm btn-outline-secondary order-filter-btn active" data-filter="all">All</button>
            <button class="btn btn-sm btn-outline-warning order-filter-btn" data-filter="Pending">Pending</button>
            <button class="btn btn-sm btn-outline-info order-filter-btn" data-filter="Received">Received</button>
            <button class="btn btn-sm btn-outline-primary order-filter-btn" data-filter="Preparing">Preparing</button>
            <button class="btn btn-sm btn-outline-success order-filter-btn" data-filter="Ready for Pickup">Ready</button>
            <button class="btn btn-sm btn-outline-secondary order-filter-btn" data-filter="Completed">Completed</button>
            <button class="btn btn-sm btn-outline-danger order-filter-btn" data-filter="Cancelled">Cancelled</button>
        </div>
    </div>

    <div id="ordersList"></div>
    <div id="emptyOrdersMessage" class="text-center py-5" style="display: none;">
        <h4 class="text-muted">📭 No Orders</h4>
        <p class="text-muted">You have no orders yet. Start shopping!</p>
        <a href="products.html" class="btn btn-success mt-2">🛍️ Shop Now</a>
    </div>
    <a href="products.html" class="btn btn-outline-success mt-3" id="continueShoppingBtn" style="display: none;">← Continue Shopping</a>
</div>

<footer class="bg-dark text-white text-center p-4 mt-5">
    <p class="mb-0">© 2026 Sari-Sari Store Management System</p>
    <small>Cash payment upon pickup</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/shared.js"></script>
<script src="js/script.js"></script>

<script>
    let currentFilter = "all";

    function getOrdersForView() {
        const allOrders = getOrders();
        const user = JSON.parse(localStorage.getItem("loggedInUser") || "{}");
        if (user.role === "admin" || user.role === "staff") return allOrders;
        if (user.email) return allOrders.filter(o => o.user_email === user.email);
        return allOrders;
    }

    function renderOrders() {
        const ordersList = document.getElementById("ordersList");
        const emptyMessage = document.getElementById("emptyOrdersMessage");
        const continueBtn = document.getElementById("continueShoppingBtn");

        let orders = getOrdersForView();
        if (currentFilter !== "all") orders = orders.filter(o => o.status === currentFilter);
        ordersList.innerHTML = "";

        if (orders.length === 0) {
            ordersList.style.display = "none";
            emptyMessage.style.display = "block";
            continueBtn.style.display = "none";
            return;
        }

        ordersList.style.display = "block";
        emptyMessage.style.display = "none";
        continueBtn.style.display = "inline-block";

        orders.forEach(function(order) {
            const card = document.createElement("div");
            card.className = "order-card shadow-sm mb-3";

            let statusColor = "bg-warning text-dark";
            if (order.status === "Received") statusColor = "bg-info text-dark";
            if (order.status === "Preparing") statusColor = "bg-primary";
            if (order.status === "Ready for Pickup") statusColor = "bg-success";
            if (order.status === "Completed") statusColor = "bg-secondary";
            if (order.status === "Cancelled") statusColor = "bg-danger";

            let itemsHTML = "";
            order.items.forEach(function(item) {
                itemsHTML += `<p class="mb-1">${item.name} x ${item.qty} — ₱${(item.price * item.qty).toFixed(2)}</p>`;
            });

            const paymentHTML = order.payment
                ? `<small class="text-success d-block">✅ Paid: ₱${order.payment.amountPaid.toFixed(2)} (Change: ₱${(order.payment.change || 0).toFixed(2)})</small>`
                : "";

            const cancelReasonHTML = (order.status === "Cancelled" && order.cancel_reason)
                ? `<small class="text-danger d-block">❌ Reason: ${order.cancel_reason}</small>`
                : "";

            card.innerHTML = `
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="mb-1">Order #${order.id}</h5>
                        <small class="text-muted">Placed on ${formatDisplayDate(order.date)}</small>
                    </div>
                    <span class="badge ${statusColor}">${order.status}</span>
                </div>
                <hr>
                ${itemsHTML}
                <hr>
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <small class="text-muted">Pickup: ${order.pickup_date || "-"} ${order.pickup_time || ""}</small>
                        ${paymentHTML}
                        ${cancelReasonHTML}
                    </div>
                    <div class="d-flex align-items-center gap-3">
                        <strong class="text-success">₱${order.total.toFixed(2)}</strong>
                        ${order.status === "Pending" ? `<button class="btn btn-outline-danger btn-sm cancel-order-btn" data-id="${order.id}">✕ Cancel</button>` : ""}
                    </div>
                </div>
            `;
            ordersList.appendChild(card);
        });

        ordersList.querySelectorAll(".cancel-order-btn").forEach(function(btn) {
            btn.addEventListener("click", function() {
                const orderId = parseInt(btn.getAttribute("data-id"));

                showConfirm(
                    "Are you sure you want to cancel Order #" + orderId + "?",
                    async function() {
                        try {
                            const response = await fetch('api/orders.php', {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ id: orderId, status: "Cancelled", cancel_reason: "Cancelled by customer" })
                            });
                            const data = await response.json();

                            if (data.success) {
                                showToast("Order #" + orderId + " cancelled successfully.", "success");
                                await getOrdersFromDB(); // I-refresh galing DB
                            } else {
                                showToast(data.message, "danger");
                            }
                        } catch (error) {
                            showToast("Server error. Try again.", "danger");
                        }
                        renderOrders();
                    },
                    { title: "Cancel Order", confirmText: "Yes, Cancel", type: "danger" }
                );
            });
        });
    }

    document.querySelectorAll(".order-filter-btn").forEach(function(btn) {
        btn.addEventListener("click", function() {
            document.querySelectorAll(".order-filter-btn").forEach(b => { b.classList.remove("active"); });
            btn.classList.add("active");
            currentFilter = btn.getAttribute("data-filter");
            renderOrders();
        });
    });

    document.addEventListener("DOMContentLoaded", async function() {
        if (typeof renderNavbar === "function") renderNavbar();
        
        // KUNIN MUNA SA DATABASE BAGO MAG-RENDER
        await getOrdersFromDB();
        renderOrders();
    });
</script>

</body>
</html>
