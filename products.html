<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Sari-Sari Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR (DYNAMIC) -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand text-success" href="index.html">🛒 Sari-Sari Store</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto align-items-lg-center" id="navLinks"></ul>
        </div>
    </div>
</nav>

<!-- PAGE HEADER -->
<section class="page-header text-center">
    <div class="container">
        <h1>🛍️ Our Products</h1>
        <p>Choose the products and quantity you want to order.</p>
    </div>
</section>

<!-- SEARCH -->
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <input type="text" id="searchInput" class="form-control form-control-lg shadow-sm" placeholder="🔍 Search product...">
        </div>
    </div>
</div>

<!-- CATEGORIES -->
<section class="container mt-4">
    <h3>Categories</h3>
    <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-success category-btn" data-category="all">All</button>
        <button class="btn btn-outline-success category-btn" data-category="beverages">Beverages</button>
        <button class="btn btn-outline-success category-btn" data-category="snacks">Snacks</button>
        <button class="btn btn-outline-success category-btn" data-category="canned">Canned Goods</button>
        <button class="btn btn-outline-success category-btn" data-category="personal">Personal Care</button>
        <button class="btn btn-outline-success category-btn" data-category="household">Household</button>
    </div>
</section>

<!-- PRODUCTS -->
<div class="container mt-4">
    <div class="row g-4" id="productList"></div>
</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-4 mt-5">
    <p class="mb-0">© 2026 Sari-Sari Store Management System</p>
    <small>Cash payment upon pickup</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/shared.js"></script>
<script src="js/script.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", async function() {
        // 1. Kunin ang products mula sa database
        const products = await getProductsFromDB();
        
        // 2. I-save sa localStorage (para sa cart logic)
        localStorage.setItem("products", JSON.stringify(products));
        
        // 3. I-render ang products sa screen
        if (typeof renderProducts === "function") renderProducts();
        if (typeof attachCategoryFilter === "function") attachCategoryFilter();
    });
</script>

</body>
</html>
