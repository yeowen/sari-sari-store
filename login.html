<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sari-Sari Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-text { color: #dc3545; font-size: 14px; margin-top: 4px; display: none; }
        .form-control.is-invalid { border-color: #dc3545; }
        .form-control.is-valid { border-color: #198754; }
    </style>
</head>
<body>

<div class="login-container">
    <div class="card login-card shadow">
        <div class="card-body p-4">

            <div class="text-center mb-4">
                <h2 class="text-success">🛒 Sari-Sari Store</h2>
                <p class="text-muted">Login to your account</p>
            </div>

            <div class="alert alert-info small">
                <strong>Demo Accounts:</strong><br>
                👤 customer@demo.com / 123456<br>
                👷 staff@demo.com / 123456<br>
                👑 admin@demo.com / 123456
            </div>

            <form id="loginForm" novalidate>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email">
                    <div class="error-text" id="emailError">Please enter a valid email.</div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password">
                    <div class="error-text" id="passwordError">Password must be at least 6 characters.</div>
                </div>

                <div class="mb-3">
                    <label for="role" class="form-label">Login As</label>
                    <select class="form-select" id="role">
                        <option value="customer">Customer</option>
                        <option value="staff">Staff</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>

                <button type="submit" class="btn btn-success w-100">Login</button>
            </form>

            <div class="text-center mt-3">
                <p class="mb-0">
                    Don't have an account?
                    <a href="register.html" class="text-success">Create an account</a>
                </p>
            </div>

            <div class="text-center mt-3">
                <a href="index.html" class="text-decoration-none">← Back to Home</a>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/shared.js"></script>

<script>
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const roleSelect = document.getElementById("role");
    const emailError = document.getElementById("emailError");
    const passwordError = document.getElementById("passwordError");

    function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function showError(input, el, msg) {
        input.classList.add("is-invalid");
        input.classList.remove("is-valid");
        el.textContent = msg;
        el.style.display = "block";
    }

    function showSuccess(input, el) {
        input.classList.remove("is-invalid");
        input.classList.add("is-valid");
        el.style.display = "none";
    }

    loginForm.addEventListener("submit", async function(event) {
        event.preventDefault();
        let isValid = true;

        const email = emailInput.value.trim().toLowerCase();
        if (email === "") {
            showError(emailInput, emailError, "Email is required.");
            isValid = false;
        } else if (!isValidEmail(email)) {
            showError(emailInput, emailError, "Please enter a valid email.");
            isValid = false;
        } else {
            showSuccess(emailInput, emailError);
        }

        const password = passwordInput.value;
        if (password === "") {
            showError(passwordInput, passwordError, "Password is required.");
            isValid = false;
        } else if (password.length < 6) {
            showError(passwordInput, passwordError, "Password must be at least 6 characters.");
            isValid = false;
        } else {
            showSuccess(passwordInput, passwordError);
        }

        if (!isValid) return;

        const role = roleSelect.value;

        try {
            const response = await fetch('api/login.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, role })
            });
            const data = await response.json();

            if (data.success) {
                localStorage.setItem("loggedInUser", JSON.stringify(data.user));
                showToast("Login successful! Welcome, " + data.user.name + "!", "success");
                
                setTimeout(function() {
                    if (role === "admin") {
                        window.location.href = "admin-dashboard.html";
                    } else if (role === "staff") {
                        window.location.href = "staff-dashboard.html";
                    } else {
                        window.location.href = "index.html";
                    }
                }, 1000);
            } else {
                showToast(data.message, "danger");
            }
        } catch (error) {
            showToast("Server error. Please try again.", "danger");
            console.error(error);
        }
    });
</script>

</body>
</html>
