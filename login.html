<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Login - Sari-Sari Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-text { color: #dc3545; font-size: 0.85rem; margin-top: 4px; display: none; }
        .form-control.is-invalid { border-color: #dc3545; }
        .form-control.is-valid { border-color: #198754; }
    </style>
</head>
<body>

<div class="login-container">
    <div class="card login-card shadow">
        <div class="card-body">

            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-success-subtle text-success rounded-circle mb-3" style="width: 56px; height: 56px; font-size: 26px;">
                    🛒
                </div>
                <h2 class="text-success fw-bold fs-3 mb-1">Sari-Sari Store</h2>
                <p class="text-muted small mb-0">Login to your account</p>
            </div>

            <form id="loginForm" novalidate>

                <div class="mb-3">
                    <label for="email" class="form-label small fw-semibold">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" autocomplete="email" required>
                    <div class="error-text" id="emailError">Please enter a valid email.</div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label small fw-semibold">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password" autocomplete="current-password" required>
                    <div class="error-text" id="passwordError">Password must be at least 6 characters.</div>
                </div>

                <div class="mb-3">
                    <label for="role" class="form-label small fw-semibold">Login As</label>
                    <select class="form-select" id="role">
                        <option value="customer">Customer</option>
                        <option value="staff">Staff</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label small text-muted" for="remember">Remember me</label>
                </div>

                <button type="submit" id="loginBtn" class="btn btn-success w-100 py-2 fw-semibold">
                    <span id="loginBtnText">Login</span>
                    <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="small mb-2 text-muted">
                    Don't have an account?
                    <a href="register.html" class="text-success fw-semibold text-decoration-none">Create an account</a>
                </p>
                <a href="index.html" class="small text-muted text-decoration-none d-inline-flex align-items-center gap-1 mt-1">
                    ← Back to Home
                </a>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/shared.js"></script>

<script>
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const roleSelect = document.getElementById("role");
    const emailError = document.getElementById("emailError");
    const passwordError = document.getElementById("passwordError");
    const loginBtn = document.getElementById("loginBtn");
    const loginBtnText = document.getElementById("loginBtnText");
    const loginSpinner = document.getElementById("loginSpinner");

    function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function showError(input, el, msg) {
        input.classList.add("is-invalid");
        input.classList.remove("is-valid");
        el.textContent = msg;
        el.style.display = "block";
    }

    function showSuccess(input, el) {
        input.classList.remove("is-invalid");
        input.classList.add("is-valid");
        el.style.display = "none";
    }

    loginForm.addEventListener("submit", async function(event) {
        event.preventDefault();
        let isValid = true;

        const email = emailInput.value.trim().toLowerCase();
        if (email === "") {
            showError(emailInput, emailError, "Email is required.");
            isValid = false;
        } else if (!isValidEmail(email)) {
            showError(emailInput, emailError, "Please enter a valid email.");
            isValid = false;
        } else {
            showSuccess(emailInput, emailError);
        }

        const password = passwordInput.value;
        if (password === "") {
            showError(passwordInput, passwordError, "Password is required.");
            isValid = false;
        } else if (password.length < 6) {
            showError(passwordInput, passwordError, "Password must be at least 6 characters.");
            isValid = false;
        } else {
            showSuccess(passwordInput, passwordError);
        }

        if (!isValid) return;

        const role = roleSelect.value;

        // Loading state
        loginBtn.disabled = true;
        loginBtnText.textContent = "Logging in...";
        loginSpinner.classList.remove("d-none");

        try {
            const response = await fetch('api/login.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, role })
            });
            const data = await response.json();

            if (data.success) {
                localStorage.setItem("loggedInUser", JSON.stringify(data.user));
                showToast("Login successful! Welcome, " + data.user.name + "!", "success");
                
                setTimeout(function() {
                    if (role === "admin") {
                        window.location.href = "admin-dashboard.html";
                    } else if (role === "staff") {
                        window.location.href = "staff-dashboard.html";
                    } else {
                        window.location.href = "index.html";
                    }
                }, 800);
            } else {
                showToast(data.message, "danger");
                loginBtn.disabled = false;
                loginBtnText.textContent = "Login";
                loginSpinner.classList.add("d-none");
            }
        } catch (error) {
            showToast("Server error. Please try again.", "danger");
            console.error(error);
            loginBtn.disabled = false;
            loginBtnText.textContent = "Login";
            loginSpinner.classList.add("d-none");
        }
    });
</script>

</body>
</html>
